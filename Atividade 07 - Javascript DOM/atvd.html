<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Gerenciador de Tarefas</title>
  <style>
    body {
      background-color: #f5f0eb;
      padding: 40px 20px;
    }

    #container-tarefas {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 32px;
    }

    .card-tarefa {
      width: 260px;
    }

    .prioridade-alta  { border-color: #e57373 !important; background-color: #e6aeae; }
    .prioridade-media { border-color: #f0c040 !important; background-color: #f7e7bb; }
    .prioridade-baixa { border-color: #81c784 !important; background-color: #cce9ce; }
  </style>
</head>
<body>

<div class="container-fluid">
  <h1 style="text-align: center;">Gerenciador de Tarefas</h1>

  <div class="d-flex gap-2 mt-3">
    <input id="input-tarefa" class="form-control me-2" type="text" placeholder="Digite uma tarefa..." />
    <button id="btn-adicionar" class="btn btn-outline-success" type="button">OK</button>
  </div>
</div>

<div id="container-tarefas" class="container-fluid"></div>

<script>
  document.getElementById('btn-adicionar').addEventListener('click', adicionarTarefa);
  document.getElementById('input-tarefa').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') adicionarTarefa();
  });

  function adicionarTarefa() {
    const input = document.getElementById('input-tarefa');
    const texto = input.value.trim();
    if (!texto) return;

    const card = document.createElement('div');
    card.className = 'card card-tarefa';
    card.innerHTML = `
      <div class="card-header">Sem prioridade</div>
      <div class="card-body">
        <h5 class="card-title">${texto}</h5>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm btn-outline-danger"  onclick="mudarPrioridade(this, 'alta')">Alta</button>
          <button class="btn btn-sm btn-outline-warning" onclick="mudarPrioridade(this, 'media')">Média</button>
          <button class="btn btn-sm btn-outline-success" onclick="mudarPrioridade(this, 'baixa')">Baixa</button>
        </div>
      </div>
    `;

    document.getElementById('container-tarefas').appendChild(card);
    input.value = '';
  }

  function mudarPrioridade(btn, prioridade) {
    const card = btn.closest('.card-tarefa');
    card.classList.remove('prioridade-alta', 'prioridade-media', 'prioridade-baixa');
    card.classList.add('prioridade-' + prioridade);

    const labels = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
    card.querySelector('.card-header').textContent = labels[prioridade];
  }
</script>

</body>
</html>
